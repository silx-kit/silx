name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install --upgrade ruff build
      - run: ruff format --check .
      - run: ruff check .
      - name: Build wheel
        run: |
          python -m build --wheel
          ls dist
      - name: Check meson.build files
        run: |
          python ./tools/check_meson.py dist/silx-*.whl

  build:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }} ${{ matrix.QT_API }} ${{ matrix.numpy_version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            QT_API: PySide6
            with_opencl: true
            with_gl_test: true
            numpy_version: ""

          - os: macos-latest
            python-version: "3.14"
            QT_API: PyQt6
            with_opencl: false
            with_gl_test: false
            numpy_version: ""

          - os: windows-latest
            python-version: "3.10"
            QT_API: PyQt5
            with_opencl: false
            with_gl_test: true
            numpy_version: "numpy<2"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - uses: ./.github/actions/setup-system
      - name: Install build dependencies
        run: |
          pip install --upgrade --pre build wheel

      - name: Build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.9"
        run: |
          python -m build
          ls dist

      - name: Install
        run: |
          pip install -r ci/requirements-pinned.txt
          pip install --pre "${{ matrix.QT_API }}"
          pip install --pre "$(ls dist/silx*.whl)[full,test]"
          if [ -n "${{ matrix.numpy_version }}" ]; then
            pip uninstall -y h5pyd;
            pip install "${{ matrix.numpy_version }}";
          fi
          python ./ci/info_platform.py
          pip list

      - name: Test
        env:
          QT_API: ${{ matrix.QT_API }}
          SILX_OPENCL: ${{ matrix.with_opencl && 'True' || 'False' }}
          WITH_GL_TEST: ${{ matrix.with_gl_test && 'True' || 'False' }}
        run: |
          python -c "import silx.test, sys; sys.exit(silx.test.run_tests(verbosity=3, args=['--qt-binding=${{ matrix.QT_API }}']))"

  oldest-dependencies:
    name: "Python 3.10 on manylinux x86_64 PyQt5 with oldest dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3  # v4.3.4
        env:
          CIBW_BUILD: cp310-manylinux_x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD_FRONTEND: "build; args: -C setup-args=-Duse_openmp=disabled"

          # Install system packages, Intel OpenCL ICD and oldest dependencies
          # The ICD requires libnuma and libtinfo.so.5
          CIBW_BEFORE_TEST_LINUX: >-
            yum install -y xorg-x11-server-Xvfb mesa-dri-drivers mesa-libEGL mesa-libGL
            libxkbcommon-x11 libxkbcommon xcb-util-image xcb-util-keysyms xcb-util-renderutil
            xcb-util-wm libXrandr libXcursor libxcb numactl-libs ncurses-compat-libs &&
            curl -sSfL http://www.silx.org/pub/OpenCL/intel_opencl_icd-6.4.0.37.tar.gz | tar -xz -C /opt &&
            echo /opt/intel_opencl_icd/icd/libintelocl.so > /opt/intel_opencl_icd/vendors/intel64.icd &&
            pip install --only-binary :all: -r {project}/ci/oldest-requirements.txt
          CIBW_TEST_ENVIRONMENT: >-
            QT_API=PyQt5
            SILX_OPENCL=True
            WITH_GL_TEST=True
            OCL_ICD_VENDORS=/opt/intel_opencl_icd/vendors/intel64.icd
          CIBW_TEST_COMMAND: >-
            pip check && pip list &&
            python -c "import silx.test, sys; sys.exit(silx.test.run_tests(verbosity=3, args=['--qt-binding=PyQt5']))"
